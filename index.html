<style>
:root{--bg:#ffffff;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e6e9f0;--sub:#f1f4f9;--ac:#4f46e5;--ac2:#06b6d4;--acs:#eef0ff;--ok:#16a34a;--mid:#d97706;--bad:#dc2626;--okb:#dcfce7;--midb:#fef3c7;--badb:#fee2e2;--sh:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.04)}
:root[data-theme=dark]{--bg:#0b1020;--card:#131a2e;--tx:#e6e9f2;--mu:#8b95ad;--bd:#232c45;--sub:#1a2238;--ac:#818cf8;--ac2:#22d3ee;--acs:#232a52;--ok:#4ade80;--mid:#fbbf24;--bad:#f87171;--okb:#14532d66;--midb:#78350f66;--badb:#7f1d1d66;--sh:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
.w{max-width:1440px;margin:0 auto;padding:0 20px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.mk{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.5px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.4px}.sub{color:var(--mu);font-size:13px}
.ib{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;height:38px;padding:0 12px;cursor:pointer;font:inherit}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 0;margin-bottom:6px}
.fb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;box-shadow:var(--sh)}
.fb label{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:12px}
select,input{font:inherit;font-size:13px;color:var(--tx);background:var(--sub);border:1px solid transparent;border-radius:9px;height:36px;padding:0 10px;min-width:0;max-width:100%}
select:focus,input:focus{outline:2px solid var(--ac);outline-offset:1px}
#fa{max-width:240px}
.rs{margin-left:auto;background:var(--acs);color:var(--ac);border:0;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:26px;align-items:center;font-size:12px}
.chip{border:0;background:var(--acs);color:var(--ac);border-radius:99px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}.chip b{font-weight:600}
.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--sh);min-width:0}
.ct{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ct h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.2px}.ct small{color:var(--mu);font-size:12px}
.lbl{font-size:12px;color:var(--mu);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.top{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,3fr);gap:16px}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.ring{width:150px;height:150px}.ring circle{fill:none;stroke-width:12}.ring .rt{stroke:var(--sub)}
.ring text{fill:var(--tx);font-weight:700;font-size:22px}
.hs{display:flex;gap:18px;margin-top:6px}.hs b{display:block;font-size:20px;font-weight:700}.hs span{font-size:12px;color:var(--mu)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.k .kv{font-size:30px;font-weight:700;letter-spacing:-.8px;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.kd{font-size:12px;color:var(--mu);margin-top:8px}.kd code{font-size:11px;background:var(--sub);padding:1px 5px;border-radius:5px}
.mb{position:relative;height:8px;border-radius:99px;background:var(--sub)}.mb i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.mb s{position:absolute;left:80%;top:-4px;bottom:-4px;border-left:2px dashed var(--mu);opacity:.6}
.ok{color:var(--ok)}.mid{color:var(--mid)}.bad{color:var(--bad)}
i.ok{background:var(--ok)}i.mid{background:var(--mid)}i.bad{background:var(--bad)}
.g{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;margin-top:16px}
.stk{display:flex;flex-direction:column;gap:16px}
svg text{fill:var(--mu);font-size:11px;font-family:inherit}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mu)}.lg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap;background:var(--card)}
.sc th{position:sticky;top:0;z-index:1}
td{padding:9px 10px;border-bottom:1px solid var(--bd)}tr:last-child td{border-bottom:0}
.n{text-align:right}tr[data-k]{cursor:pointer}tr[data-k]:hover td{background:var(--sub)}
tr.on td{background:var(--acs)}tr.on td:first-child{box-shadow:inset 3px 0 var(--ac);font-weight:600}
.pl{display:inline-block;min-width:62px;text-align:center;border-radius:99px;padding:2px 8px;font-weight:600;font-size:12px}
.pl.ok{background:var(--okb)}.pl.mid{background:var(--midb)}.pl.bad{background:var(--badb)}
.qb{display:flex;align-items:center;gap:8px}.qb i{height:6px;border-radius:99px;background:var(--ac);opacity:.55;display:block}
.sc{overflow:auto;max-height:520px;margin:0 -18px -18px;padding:0 8px 8px}
.pr{display:grid;grid-template-columns:24px minmax(0,1.6fr) minmax(60px,1fr) 34px 62px;gap:10px;align-items:center;width:100%;border:0;background:none;color:var(--tx);font:inherit;font-size:13px;text-align:left;padding:8px 8px;border-radius:10px;cursor:pointer}
.pr:hover{background:var(--sub)}.pr.on{background:var(--acs)}.pr.dim{opacity:.4}
.pr .rk{color:var(--mu);font-size:12px}.pr .pt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .pb{height:10px;background:var(--sub);border-radius:99px;overflow:hidden}.pr .pb i{display:block;height:100%;border-radius:99px;background:var(--mu);opacity:.5}
.pr.vf .pb i{background:var(--ac);opacity:1}.pr .pq{font-weight:700;text-align:right}.pr .pc{color:var(--mu);font-size:12px;text-align:right}
.ph{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);cursor:default}.ph:hover{background:none}
.ag{display:flex;flex-direction:column;gap:6px}
.ag .pr{grid-template-columns:minmax(70px,.8fr) minmax(60px,2fr) 34px 60px}
.ag .pb i{background:var(--bad);opacity:.85}
.srch{height:34px;width:220px}
#t2{overflow-x:auto}
th[data-s]{cursor:pointer}th[data-s]:hover{color:var(--tx)}th.so{color:var(--ac)}
.empty{padding:30px;text-align:center;color:var(--mu)}
@media(max-width:1100px){.top{grid-template-columns:minmax(0,1fr)}.g{grid-template-columns:minmax(0,1fr)}}
